<!DOCTYPE html>
<html>
<body>
  <p>Klik tombol berikut untuk menampilkan konfirmasi</p> [cite: 178]
  <button onclick="myFunction()">Klik Disini</button> [cite: 178]
  <p id="demo"></p> [cite: 178]

  <script>
    function myFunction() {
      var x; 
      var r = confirm("Apakah anda ingin melanjutkan?"); // perbaikan typo reconfirm [cite: 178]
      
      if (r == true) { 
        x = "Anda menekan OK!";
      } else {
        x = "Anda menekan cancel!";
      }
      document.getElementById("demo").innerHTML = x; 
    }
  </script>
</body>
</html>
