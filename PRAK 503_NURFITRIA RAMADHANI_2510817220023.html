<!DOCTYPE html>
<html>
<body>
  <h1>Latihan JavaScript</h1> [cite: 82]
  <p id="demo">Javascript bisa merubah isi elemen HTML</p> 

  <script>
    function myFunction() {
      var x = document.getElementById("demo"); // temukan elemen yg mana [cite: 91]
      x.style.color = "#f5dfbb"; // rubah isinya (sesuai gambar di halaman 2)
    }
  </script>

  <button type="button" onclick="myFunction()">Click Me</button> [cite: 106]
</body>
</html>
