  <p>Klik tombol berikut untuk menampilkan konfirmasi</p> [cite: 182]

  <p id="demo"></p> // disesuaikan dari gambar halaman 5

        x = "Selamat Datang " + name + " bagaimana kabar anda hari ini?"; // sesuai gambar halaman 5 [cite: 193, 194]

      }
    }
