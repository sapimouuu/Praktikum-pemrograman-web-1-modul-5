<!DOCTYPE html>
<html>
<body>
  <h1>Latihan JavaScript</h1> [cite: 51]
  <p id="demo">Javascript bisa merubah isi elemen HTML</p>

  <script>
    function myFunction() {
      var x = document.getElementById("demo"); // temukan elemen yg mana [cite: 65]
      x.innerHTML = "Ini ini terbaru!"; // rubah isinya [cite: 67]
    }
  </script>

  <button type="button" onclick="myFunction()">Click Me!</button> [cite: 69]
</body>
</html>
