<!DOCTYPE html>
<html>
<body>
  <h1>Latihan Javascript</h1> [cite: 230]
  <p>Silahkan masukkan angka</p> [cite: 231]
  <input id="demo" type="text"> [cite: 232]
  <button type="button" onclick="myFunction()">Cek Angka</button> [cite: 267]

  <script>
    function myFunction() {
      var x = document.getElementById("demo").value;
      if (x == "" || isNaN(x)) { 
        alert("Bukan angka");
      }
    }
  </script>
</body>
</html>
