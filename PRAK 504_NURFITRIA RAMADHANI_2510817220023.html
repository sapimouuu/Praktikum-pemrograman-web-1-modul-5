<!DOCTYPE html>
<html>
<body>
  <script>
    var x = 5; // disesuaikan dari gambar halaman 2
    var y = 6; 
    var z = x + y; // disesuaikan dari gambar halaman 2

    document.write("Variabel X: " + x + "<br>");
    document.write("Variabel Y: " + y + "<br>");
    document.write("Hasil X + Y: " + z + "<br>");
    document.write("Hasil X * Y: " + (x * y) + "<br>"); 
    document.write("Hasil X / Y: " + (x / y) + "<br>"); 
  </script>
</body>
</html>
